# Next.js é detectado pela Netlify (adaptador OpenNext); aqui fica só o que a detecção não cobre.

# Ping diário no Supabase para o plano Free não pausar o projeto (docs/setup.md).
[functions."supabase-keepalive"]
  schedule = "@daily"

# Robôs de varredura pedem caminhos de WordPress, PHP e arquivos de segredo (.env, .git...).
# Sem estas regras, cada 404 passa pela função do servidor do Next e gasta créditos.
# As regras respondem 404 direto da CDN com uma página estática (public/nao-encontrado.html).
# Nenhuma delas cobre rota real do site (/, /privacidade, /robots.txt, /sitemap.xml, /_next/*).
# Ver docs/setup.md, "Robôs de varredura e 404 na Netlify".

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/nao-encontrado.html"
  status = 404
  force = true

