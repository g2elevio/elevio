# Aplica as migrations do Drizzle no banco de produção (Supabase).
# Rodar manualmente em Actions → "Migrar banco" → Run workflow.
# Requer o secret DATABASE_URL_UNPOOLED (Session pooler, porta 5432).
name: Migrar banco

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migrations
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Configure o secret DATABASE_URL_UNPOOLED em Settings → Secrets and variables → Actions."
            exit 1
          fi
          pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
